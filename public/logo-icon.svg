<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#008ba8" />
    </linearGradient>
    <linearGradient id="indigo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <g>
    <!-- Top Face Facets -->
    <polygon points="38,10 50,25 38,40" fill="#00d4ff" />
    <polygon points="38,10 62,10 50,25" fill="#00c2e0" />
    <polygon points="62,10 62,40 50,25" fill="#00b0cc" />
    <polygon points="62,10 86,30 62,40" fill="#009ebb" />

    <!-- Right Upper Facets -->
    <polygon points="86,30 86,50 62,40" fill="#008ba8" />
    <polygon points="86,50 62,50 62,40" fill="#007da0" />

    <!-- Left Upper Facets -->
    <polygon points="38,10 38,40 14,30" fill="#818cf8" />
    <polygon points="14,30 14,50 38,40" fill="#6366f1" />
    <polygon points="14,50 38,50 38,40" fill="#4f46e5" />

    <!-- Left Lower Facets -->
    <polygon points="14,50 14,70 38,60" fill="#3b82f6" />
    <polygon points="14,70 38,90 38,60" fill="#2563eb" />
    <polygon points="14,50 38,50 38,60" fill="#1d4ed8" />

    <!-- Bottom Facets -->
    <polygon points="38,90 62,90 50,75" fill="#1e40af" />
    <polygon points="38,90 50,75 38,60" fill="#1e3a8a" />
    <polygon points="62,90 62,60 50,75" fill="#172554" />
    <polygon points="62,90 86,70 62,60" fill="#1d4ed8" />

    <!-- G Center Bar Facets -->
    <polygon points="86,70 86,50 62,60" fill="#3b82f6" />
    <polygon points="86,50 62,50 62,60" fill="#2563eb" />
    
    <!-- Inward Turn Facets -->
    <polygon points="62,50 50,50 62,60" fill="#60a5fa" />
    <polygon points="50,50 50,60 62,60" fill="#3b82f6" />
  </g>
</svg>
