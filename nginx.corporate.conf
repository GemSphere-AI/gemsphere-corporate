server {
    listen 80;
    server_name localhost gemsphere.ai www.gemsphere.ai gemsphere.in www.gemsphere.in gemsphere.co.in www.gemsphere.co.in;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Open File Descriptor Cache to eliminate disk system calls
    open_file_cache max=20000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Optimized Gzip Level 5 Compression (Production Sweet Spot)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # =========================================================================
    # SEO CATEGORY F: Root Domain Normalization
    # Redirect root domain to /en/ with permanent 301
    # =========================================================================
    location = / {
        return 301 /en/;
    }

    # =========================================================================
    # SEO CATEGORY C: Legacy Regional Locale Redirects
    # =========================================================================
    rewrite ^/(?:en-us|en-gb|en-ae|en-in)(?:/|$)(.*)$ /en/$1 permanent;
    rewrite ^/(?:de-de|de-at)(?:/|$)(.*)$ /de/$1 permanent;
    rewrite ^/(?:fr-fr|fr-be)(?:/|$)(.*)$ /fr/$1 permanent;
    rewrite ^/(?:es-es|es-mx)(?:/|$)(.*)$ /es/$1 permanent;
    rewrite ^/(?:ja-jp)(?:/|$)(.*)$ /ja/$1 permanent;
    rewrite ^/(?:ar-ae|ar-sa|ar-eg)(?:/|$)(.*)$ /ar/$1 permanent;
    rewrite ^/(?:pt)(?:/|$)(.*)$ /pt-br/$1 permanent;

    # =========================================================================
    # SEO CATEGORY A: Direct 1:1 Semantic Redirects for Naked Non-Localized Paths
    # Eliminates GSC 404s by routing un-prefixed requests to authoritative /en/
    # =========================================================================
    rewrite ^/(products|services|compare|industries|about|contact|solutions|careers|security|privacy|privacy-policy|terms|blog|ai-solutions|roi-calculator|demo|resources|cookie-policy|delete-account|authors)(/.*)?$ /en/$1$2 permanent;

    # =========================================================================
    # SEO CATEGORY B: Competitor Comparison Consolidation (Duplicate to Pillar)
    # Consolidates 13 cannibalistic comparison duplicates into 26 primary pillars
    # =========================================================================
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/shopify-vs-custom-ecommerce/?$ /$1/compare/gemsphere-vs-shopify/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/salesforce-vs-custom-crm/?$ /$1/compare/gemsphere-vs-salesforce/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/zoho-vs-custom-crm/?$ /$1/compare/gemsphere-vs-zoho/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/hubspot-vs-custom-crm/?$ /$1/compare/gemsphere-vs-hubspot/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/tally-vs-cloud-erp/?$ /$1/compare/gemsphere-vs-tally/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/tally-vs-gemsphere/?$ /$1/compare/gemsphere-vs-tally/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/vyapar-vs-gemsphere/?$ /$1/compare/gemsphere-vs-vyapar/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/oracle-vs-custom-erp/?$ /$1/compare/gemsphere-vs-oracle/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/sap-vs-custom-erp/?$ /$1/compare/gemsphere-vs-sap/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/netsuite-vs-custom-erp/?$ /$1/compare/gemsphere-vs-netsuite/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/cloudbeds-vs-gemsphere/?$ /$1/compare/gemsphere-vs-cloudbeds/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/mews-vs-gemsphere/?$ /$1/compare/gemsphere-vs-mews/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/compare/opera-vs-gemsphere/?$ /$1/compare/gemsphere-vs-opera/ permanent;

    # =========================================================================
    # SEO CATEGORY F: Enforce Trailing Slash on Localized HTML Routes
    # =========================================================================
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/([a-zA-Z0-9_-]+)$ /$1/$2/ permanent;
    rewrite ^/([a-z]{2}(?:-[a-z]{2})?)/(products|services|compare|industries|blog|solutions|authors)/([a-zA-Z0-9_-]+)$ /$1/$2/$3/ permanent;

    # Android Digital Asset Links & Well-Known Verification
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Web App Manifest (ASO & PWA)
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=604800";
    }

    # RSS 2.0 Syndication Feed (SEO & GEO)
    location = /feed.xml {
        default_type application/rss+xml;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600";
    }

    # Serve static export files
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Static assets long-term cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Dedicated 404 error page (Category E)
    error_page 404 /en/404.html;
}
