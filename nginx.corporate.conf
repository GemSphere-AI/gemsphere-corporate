server {
    listen 80;
    server_name localhost gemsphere.ai www.gemsphere.ai gemsphere.in www.gemsphere.in gemsphere.co.in www.gemsphere.co.in;

    root /usr/share/nginx/html;
    index index.html;

    # Open File Descriptor Cache to eliminate disk system calls
    open_file_cache max=20000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Optimized Gzip Level 5 Compression (Production Sweet Spot)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rewrite root domain request to default locale
    location = / {
        return 301 /en-us;
    }

    # Serve static export files
    location / {
        try_files $uri $uri.html $uri/ /en-us.html;
    }

    # Static assets long-term cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
